<!doctype html>
<meta charset="utf-8" />
<title>layout lint</title>
<script type="module">
  import * as L from '/src/world/layout.ts';
  import { groundY } from '/src/world/terrain.ts';

  const out = [];
  const say = (s) => out.push(s);

  // Every placement pad must clear every road polygon and every other pad.
  for (const p of L.PLACEMENTS) {
    const half = [p.pad[0] / 2, p.pad[1] / 2];
    let worstRoad = -Infinity;
    let worstRoadName = '';
    for (let i = 0; i < 4; i++) {
      const lx = (i & 1 ? 1 : -1) * half[0];
      const lz = (i & 2 ? 1 : -1) * half[1];
      const [ox, oz] = L.rotateOffset(lx, lz, p.rotY);
      const x = p.pos[0] + ox;
      const z = p.pos[2] + oz;
      for (const r of L.ROADS) {
        const d = r.width / 2 - L.distanceToSegment(x, z, r.a, r.b);
        if (d > worstRoad) {
          worstRoad = d;
          worstRoadName = `${r.a} -> ${r.b}`;
        }
      }
      for (const rect of [L.APRON, L.INN_FORECOURT]) {
        const d = L.insetInRect(x, z, rect.centre, rect.size, rect.rotY ?? 0);
        if (d > worstRoad) {
          worstRoad = d;
          worstRoadName = `apron ${rect.centre}`;
        }
      }
    }
    if (worstRoad > 0) say(`PAD-ON-ROAD  ${p.id} corner ${worstRoad.toFixed(2)} m inside ${worstRoadName}`);

    for (const q of L.PLACEMENTS) {
      if (q === p) continue;
      const gapX = Math.abs(p.pos[0] - q.pos[0]) - (p.pad[0] + q.pad[0]) / 2;
      const gapZ = Math.abs(p.pos[2] - q.pos[2]) - (p.pad[1] + q.pad[1]) / 2;
      if (gapX < 0 && gapZ < 0) say(`PAD-OVERLAP  ${p.id} / ${q.id}  ${gapX.toFixed(1)} ${gapZ.toFixed(1)}`);
    }
  }

  // Fences and torches must not stand in a road surface.
  for (const run of L.FENCE_RUNS) {
    for (let t = 0; t <= 1; t += 0.05) {
      const x = run.from[0] + (run.to[0] - run.from[0]) * t;
      const z = run.from[1] + (run.to[1] - run.from[1]) * t;
      if (L.flatInset(x, z) > 0) {
        say(`FENCE-ON-FLAT  ${run.from} -> ${run.to} at (${x.toFixed(1)}, ${z.toFixed(1)})`);
        break;
      }
    }
  }
  for (const [x, z] of L.TORCH_POSTS) {
    for (const r of L.ROADS) {
      if (L.distanceToSegment(x, z, r.a, r.b) < r.width / 2) say(`TORCH-ON-ROAD  (${x}, ${z})`);
    }
  }

  // Road bearings, as built.
  for (const r of L.ROADS) {
    const dx = r.b[0] - r.a[0];
    const dz = r.b[1] - r.a[1];
    const deg = ((Math.atan2(dx, -dz) * 180) / Math.PI + 360) % 360;
    say(`ROAD  ${String(deg.toFixed(1)).padStart(5)} deg  ${Math.hypot(dx, dz).toFixed(0)} m  ${r.surface}  ${r.a} -> ${r.b}`);
  }

  say(`VOID  ${L.TERRAIN_VOIDS.map((v) => v.map((n) => n.toFixed(1)).join(',')).join(' | ')}`);
  say(`SPAWN flatInset ${L.flatInset(L.SPAWN[0], L.SPAWN[2]).toFixed(2)} groundY ${groundY(L.SPAWN[0], L.SPAWN[2]).toFixed(3)}`);

  // The lake must not swallow a road.
  for (const r of L.ROADS) {
    for (let t = 0; t <= 1; t += 0.01) {
      const x = r.a[0] + (r.b[0] - r.a[0]) * t;
      const z = r.a[1] + (r.b[1] - r.a[1]) * t;
      const inX = Math.abs(x - L.LAKE.centre[0]) < L.LAKE.size[0] / 2;
      const inZ = Math.abs(z - L.LAKE.centre[1]) < L.LAKE.size[1] / 2;
      if (inX && inZ) {
        say(`ROAD-IN-LAKE  ${r.a} -> ${r.b} at (${x.toFixed(0)}, ${z.toFixed(0)})`);
        break;
      }
    }
  }

  // The props that actually ship: every scattered one must clear road and pad.
  const { buildVillageProps } = await import('/src/build/props.ts');
  const props = buildVillageProps();
  const HEAD = L.FENCE_RUNS.length + L.TORCH_POSTS.length; // both stand on paving on purpose
  const ANCHORS = 11;
  let worst = -Infinity;
  let worstAt = null;
  let n = 0;
  for (const child of props.children) {
    n++;
    if (n <= HEAD || n > props.children.length - ANCHORS) continue;
    const x = child.position.x;
    const z = child.position.z;
    const inset = L.flatInset(x, z);
    if (inset > worst) {
      worst = inset;
      worstAt = [child.name || child.type, x.toFixed(1), z.toFixed(1)];
    }
  }
  say(`PROPS ${props.children.length} placed; worst flatInset ${worst.toFixed(2)} at ${worstAt}`);

  document.title = 'done';
  console.log('LINT\n' + out.join('\n'));
</script>
